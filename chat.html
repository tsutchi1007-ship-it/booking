<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f39">
  <meta name="description" content="Unlimited Life 円レイへのチャット相談ページです。">
  <title>チャット相談 | Unlimited Life</title>
  <style>
    :root {
      --ink: #173f39;
      --ink-2: #285b52;
      --cream: #f8f4e9;
      --paper: rgba(255,255,255,.9);
      --gold: #d8a84e;
      --line: rgba(23,63,57,.14);
      --muted: #6d7773;
      --shadow: 0 24px 70px rgba(23,63,57,.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 7% 4%, rgba(216,168,78,.22), transparent 30%),
        radial-gradient(circle at 95% 20%, rgba(72,132,117,.18), transparent 32%),
        var(--cream);
    }
    body::before, body::after {
      content: ""; position: fixed; width: 280px; height: 280px;
      border: 1px solid rgba(23,63,57,.12); transform: rotate(45deg);
      pointer-events: none; z-index: -1;
    }
    body::before { top: -190px; right: 7%; }
    body::after { bottom: -220px; left: -80px; }
    .page { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 56px; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); letter-spacing: .12em; font-weight: 700; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; }
    .brand-mark::after { content: "∞"; font-size: 20px; }
    .site-nav { display: flex; align-items: center; gap: 8px; }
    .site-nav a { padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: rgba(255,255,255,.48); font-size: 12px; font-weight: 700; text-decoration: none; transition: .2s; }
    .site-nav a:hover { color: white; border-color: var(--ink); background: var(--ink); transform: translateY(-1px); }
    .hero { max-width: 720px; margin: 0 auto 26px; text-align: center; }
    .eyebrow { margin: 0 0 13px; color: var(--ink-2); font-size: 12px; letter-spacing: .18em; font-weight: 700; }
    h1 { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: clamp(38px, 7vw, 62px); line-height: 1.2; font-weight: 500; letter-spacing: -.03em; }
    h1 em { color: var(--gold); font-style: normal; }
    .lead { margin: 18px auto 0; max-width: 620px; color: #45534f; font-size: 15px; line-height: 2; }
    .chat-card { max-width: 720px; margin: 0 auto; padding: 16px; background: var(--paper); border: 1px solid rgba(255,255,255,.92); border-radius: 26px; box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    #conversations-wrapper { width: 100%; height: 620px; overflow: hidden; border-radius: 17px; background: #fff; }
    .help { max-width: 720px; margin: 18px auto 0; color: var(--muted); font-size: 11px; line-height: 1.8; text-align: center; }
    .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 22px; margin-top: 26px; color: var(--muted); font-size: 11px; }
    .links a { color: var(--muted); text-underline-offset: 3px; }
    .links a:hover { color: var(--ink); }
    @media (max-width: 600px) {
      .page { width: min(100% - 20px, 1040px); padding-top: 24px; }
      .site-header { margin-bottom: 28px; gap: 12px; }
      .brand { gap: 8px; font-size: 12px; letter-spacing: .08em; }
      .brand-mark { width: 30px; height: 30px; }
      .site-nav a { padding: 9px 12px; font-size: 11px; }
      .chat-card { padding: 8px; border-radius: 20px; }
      #conversations-wrapper { height: 70vh; min-height: 520px; border-radius: 14px; }
    }
  </style>
